<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elementor #2676 (Draft)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --primary: #4f46e5;
        --primary-600: #4338ca;
        --primary-soft: #eeedfd;
        --primary-line: #cfcbf7;
        --ink: #14142b;
        --text: #2b2d42;
        --muted: #8b8fa3;
        --line: #ebecf3;
        --bg: #f6f6fa;
        --panel: #fff;
        --radius: 14px;
        --topbar-h: 64px;
        --panel-w: 300px;
        --shadow: 0 1px 2px rgba(20, 20, 43, 0.04), 0 10px 28px -10px rgba(79, 70, 229, 0.25);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: "Plus Jakarta Sans", Inter, "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
        color: var(--text);
        background: var(--bg);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
      }
      svg {
        display: block;
      }
      .ic {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ================= TOP BAR ================= */
      .topbar {
        position: fixed;
        inset: 0 0 auto 0;
        height: var(--topbar-h);
        background: #fff;
        color: var(--ink);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        padding: 0 16px 0 20px;
        gap: 4px;
        z-index: 20;
      }
      .tb-left {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 275px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-right: 22px;
        text-decoration: none;
        color: var(--ink);
      }
      .logo {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: var(--primary);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 19px;
        font-weight: 700;
        box-shadow: 0 6px 14px -6px var(--primary);
      }
      .brand-text {
        display: flex;
        flex-direction: column;
        line-height: 1.2;
      }
      .brand-text strong {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .brand-text small {
        font-size: 12px;
        font-weight: 400;
        color: var(--muted);
      }
      @media (max-width: 700px) {
        .brand-text {
          display: none;
        }
      }
      .tb-btn {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        color: #6b6f86;
        position: relative;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .tb-btn:hover {
        background: var(--bg);
        color: var(--ink);
      }
      .tb-btn.active {
        background: var(--primary-soft);
        color: var(--primary);
      }
      .tb-btn .ic {
        width: 20px;
        height: 20px;
      }
      .tb-title {
        /* position: absolute; */
        /* left: 480px; */
        margin-left: 30px;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px;
        font-size: 14.5px;
        font-weight: 600;
        color: var(--ink);
      }
      .tb-title::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #10b981;
        margin-right: 2px;
      }
      .tb-title i {
        font-style: normal;
        font-weight: 500;
        color: var(--muted);
      }
      .tb-title .ic {
        width: 14px;
        height: 14px;
        stroke-width: 2;
      }
      .tb-devices {
        /* position: absolute;
        left: calc(50% + 340px); */
        display: flex;
        gap: 6px;
      }
      .tb-devices .tb-btn.on {
        background: var(--primary-soft);
        color: var(--primary);
      }
      .tb-right {
        /* margin-left: auto; */
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .dot {
        position: absolute;
        top: 9px;
        right: 9px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--primary);
        border: 2px solid #fff;
        box-sizing: content-box;
      }
      .publish {
        display: flex;
        margin-left: 14px;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 8px 18px -8px var(--primary);
      }
      .publish .main {
        background: var(--primary);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        padding: 0 22px;
        height: 40px;
      }
      .publish .arrow {
        background: var(--primary);
        color: #fff;
        width: 38px;
        height: 40px;
        display: grid;
        place-items: center;
        border-left: 1px solid rgba(255, 255, 255, 0.25);
      }
      .publish .arrow .ic {
        width: 15px;
        height: 15px;
        stroke-width: 2.2;
      }
      .publish button:hover {
        background: var(--primary-600);
      }

      /* ================= SIDE PANEL ================= */
      .panel {
        position: fixed;
        top: var(--topbar-h);
        bottom: 0;
        left: 0;
        width: var(--panel-w);
        background: var(--panel);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        z-index: 10;
      }
      .panel h2 {
        font-size: 17px;
        font-weight: 700;
        color: var(--ink);
        padding: 22px 20px 2px;
        letter-spacing: -0.01em;
      }
      .panel h2::after {
        content: "Build your page section by section.";
        display: block;
        font-size: 12px;
        font-weight: 400;
        color: var(--muted);
        margin-top: 4px;
        letter-spacing: 0;
      }
      .tabs {
        display: flex;
        gap: 6px;
        padding: 16px 16px 0;
      }
      .tabs button {
        flex: 1;
        height: 36px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        color: #6b6f86;
        display: grid;
        place-items: center;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .tabs button:hover {
        background: var(--bg);
      }
      .tabs button.on {
        background: var(--primary-soft);
        color: var(--primary);
      }
      .panel-body {
        flex: 1;
        overflow-y: auto;
        padding: 16px 16px 12px;
      }
      .panel-body::-webkit-scrollbar {
        width: 6px;
      }
      .panel-body::-webkit-scrollbar-thumb {
        background: #dcdde8;
        border-radius: 6px;
      }
      .search {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0 14px;
        color: var(--muted);
        margin-bottom: 24px;
        background: #fff;
        transition:
          border 0.15s,
          box-shadow 0.15s;
      }
      .search:focus-within {
        border-color: var(--primary-line);
        box-shadow: 0 0 0 4px var(--primary-soft);
      }
      .search svg {
        width: 14px;
        height: 14px;
      }
      .search input {
        border: 0;
        outline: 0;
        font:
          500 13px "Plus Jakarta Sans",
          sans-serif;
        width: 100%;
        background: none;
        color: var(--ink);
      }
      .search input::placeholder {
        color: #7b7f95;
        font-style: normal;
      }
      .cat {
        margin-bottom: 8px;
        border: 0;
        border-radius: 0;
        background: transparent;
        overflow: visible;
      }
      .cat.open {
        border: 0;
        box-shadow: none;
      }
      .cat-title {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0;
        margin: 0 0 12px;
        font-size: 13px;
        font-weight: 700;
        color: var(--ink);
        text-align: left;
        height: 28px;
      }
      .cat-title:hover {
        background: transparent;
        color: var(--primary);
      }
      .cat.open .cat-title {
        color: var(--ink);
      }
      .cat-title .count {
        margin-left: 8px;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        background: var(--bg);
        padding: 2px 8px;
        border-radius: 999px;
      }
      .cat-title .chev {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: transform 0.25s;
      }
      .cat.open .chev {
        transform: rotate(180deg);
      }
      .cat-body {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 0.3s ease;
      }
      .cat.open .cat-body {
        grid-template-rows: 1fr;
      }
      .cat-inner {
        overflow: hidden;
        min-height: 0;
      }
      .cat-inner .widgets {
        padding: 0 0 8px;
      }
      .widgets {
        padding: 2px 12px 14px;
      }
      .widgets {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .widget {
        --c: #4f46e5;
        --b: #eeedfd;
        height: 98px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: #fff;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: space-between;
        padding: 12px;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--ink);
        cursor: grab;
        transition:
          box-shadow 0.18s,
          border-color 0.18s,
          transform 0.18s;
      }
      .widget:hover {
        border-color: var(--primary-line);
        /* box-shadow: var(--shadow);
        transform: translateY(-2px); */
      }
      .widget svg {
        width: 34px;
        height: 34px;
        padding: 7px;
        border-radius: 10px;
        background: var(--b);
        stroke: var(--c);
        fill: none;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .widget:nth-child(5n + 1) {
        --c: #4f46e5;
        --b: #eeedfd;
      }
      .widget:nth-child(5n + 2) {
        --c: #2f80ed;
        --b: #e5f0ff;
      }
      .widget:nth-child(5n + 3) {
        --c: #e11d74;
        --b: #fde8f1;
      }
      .widget:nth-child(5n + 4) {
        --c: #0d9f6e;
        --b: #e2f7ee;
      }
      .widget:nth-child(5n) {
        --c: #ea7a1c;
        --b: #fff0e0;
      }
      .pro {
        margin: 0 16px 16px;
        border: 1px solid var(--primary-line);
        background: var(--primary-soft);
        border-radius: var(--radius);
        text-align: center;
        padding: 14px 10px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ink);
        line-height: 1.3;
      }
      .pro a {
        display: inline-block;
        margin-top: 8px;
        background: var(--primary);
        color: #fff;
        padding: 8px 16px;
        border-radius: 9px;
        font-weight: 600;
        font-size: 12.5px;
        text-decoration: none;
        box-shadow: 0 6px 14px -6px var(--primary);
      }
      .pro a:hover {
        background: var(--primary-600);
      }

      /* collapse handle */
      .handle {
        position: fixed;
        left: var(--panel-w);
        top: 50%;
        margin-left: -14px;
        width: 28px;
        height: 28px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 50%;
        display: grid;
        place-items: center;
        z-index: 11;
        box-shadow: 0 4px 10px rgba(20, 20, 43, 0.08);
        transition: transform 0.2s;
      }
      .handle:hover {
        border-color: var(--primary-line);
      }
      .handle svg {
        width: 10px;
        height: 10px;
        stroke: var(--primary);
        stroke-width: 2;
        fill: none;
      }

      /* ================= CANVAS ================= */
      .canvas {
        position: fixed;
        top: var(--topbar-h);
        left: var(--panel-w);
        right: 0;
        bottom: 0;
        background: var(--bg);
        background-image: radial-gradient(#dfe0ec 1px, transparent 1px);
        background-size: 20px 20px;
        overflow: auto;
        padding: 80px 32px 60px;
      }
      .drop {
        max-width: 1140px;
        margin: 0 auto;
        height: 200px;
        border: 1.5px dashed var(--primary-line);
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 20px 40px -24px rgba(79, 70, 229, 0.25);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      .drop-btns {
        display: flex;
        gap: 8px;
      }
      .drop-btns button {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: var(--primary-soft);
        display: grid;
        place-items: center;
        color: var(--primary);
        transition:
          transform 0.15s,
          background 0.15s;
      }
      .drop-btns button:hover {
        transform: translateY(-2px);
        background: #e2dffc;
      }
      .drop-btns button.ai {
        background: var(--primary);
        color: #fff;
        box-shadow: 0 8px 18px -8px var(--primary);
      }
      .drop-btns svg {
        width: 18px;
        height: 18px;
      }
      .drop p {
        font-style: normal;
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
      }

      /* hide panel collapse state */
      body.collapsed .panel {
        transform: translateX(-100%);
      }
      body.collapsed .handle {
        left: 0;
        margin-left: 14px;
        transform: rotate(180deg);
      }
      body.collapsed .canvas {
        left: 0;
      }

      @media (max-width: 1100px) {
        .tb-title,
        .tb-devices {
          display: none;
        }
      }
      @media (max-width: 700px) {
        :root {
          --panel-w: 220px;
        }
        .canvas {
          padding-top: 40px;
        }
      }

      /* tooltips (top bar) */
      [data-tip] {
        position: relative;
      }
      [data-tip]::after {
        content: attr(data-tip);
        position: absolute;
        top: calc(100% + 4px);
        left: 50%;
        transform: translate(-50%, -4px);
        background: var(--ink);
        color: #fff;
        font:
          600 11.5px/1 "Plus Jakarta Sans",
          sans-serif;
        white-space: nowrap;
        padding: 7px 10px;
        border-radius: 8px;
        box-shadow: 0 8px 20px -6px rgba(20, 20, 43, 0.4);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.15s,
          transform 0.15s;
        z-index: 50;
      }
      [data-tip]::before {
        content: "";
        position: absolute;
        top: calc(100% - 0px);
        left: 50%;
        transform: translate(-50%, -4px) rotate(45deg);
        width: 8px;
        height: 8px;
        background: var(--ink);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.15s,
          transform 0.15s;
        z-index: 49;
      }
      [data-tip]:hover::after,
      [data-tip]:focus-visible::after {
        opacity: 1;
        transform: translate(-50%, 0);
        transition-delay: 0.25s;
      }
      [data-tip]:hover::before,
      [data-tip]:focus-visible::before {
        opacity: 1;
        transform: translate(-50%, 0) rotate(45deg);
        transition-delay: 0.25s;
      }
    </style>
  </head>
  <body>
    <!-- ================= TOP BAR ================= -->
    <header class="topbar">
      <div class="tb-left">
        <a class="brand" href="#" title="Astro Studio">
          <span class="logo">A</span>
          <span class="brand-text"><strong>Astro Studio</strong><small>Visual site builder</small></span>
        </a>
      </div>

      <div class="tb-center" style="flex: 1; display: flex; justify-content: center; justify-content: space-between">
        <div style="display: flex; justify-content: space-around; align-items: center; gap: 30px">
          <div style="display: flex; align-items: center">
            <button class="tb-btn active" data-tip="Add element">
              <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
            </button>
            <!-- <button class="tb-btn" data-tip="Site Settings">
            <svg class="ic" viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9l-4.7 1.8L12 15.5l-1.8-4.7L5.5 9l4.7-1.3zM18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z" /></svg>
          </button> -->
            <button class="tb-btn" data-tip="Settings">
              <svg class="ic" viewBox="0 0 24 24">
                <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4M14 3l5 5v3M14 3v5h5" />
                <circle cx="17" cy="17" r="3" />
                <path d="M17 14.5v-1M17 20.5v-1M14.5 17h-1M20.5 17h-1" />
              </svg>
            </button>
            <button class="tb-btn" data-tip="History">
              <svg class="ic" viewBox="0 0 24 24">
                <path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5" />
                <path d="M3.5 4v4.5H8M12 8v4.5l3 2" />
              </svg>
            </button>
            <button class="tb-title">
              Astrodio #2676 <i>(Draft)</i>
              <svg class="ic" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg>
            </button>
          </div>
        </div>
        <div class="tb-devices">
          <button class="tb-btn on" data-tip="Desktop">
            <svg class="ic" viewBox="0 0 24 24">
              <rect x="3" y="4" width="18" height="12" rx="1.5" />
              <path d="M8 20h8M12 16v4" />
            </svg>
          </button>
          <button class="tb-btn" data-tip="Tablet">
            <svg class="ic" viewBox="0 0 24 24">
              <rect x="5" y="3" width="14" height="18" rx="2" />
              <path d="M11 18h2" />
            </svg>
          </button>
          <button class="tb-btn" data-tip="Mobile">
            <svg class="ic" viewBox="0 0 24 24">
              <rect x="7" y="3" width="10" height="18" rx="2" />
              <path d="M11 18h2" />
            </svg>
          </button>
        </div>

        <div class="tb-right">
          <!-- <button class="tb-btn" data-tip="Updates">
            <svg class="ic" viewBox="0 0 24 24"><path d="M3 11v2l11 4V7zM14 8.5a3 3 0 0 1 0 7M6 14l1.5 5h2L8.5 15" /></svg><span class="dot"></span>
          </button>
          <button class="tb-btn" data-tip="Finder">
            <svg class="ic" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-4-4" />
            </svg>
          </button> -->
          <button class="tb-btn" data-tip="Structure">
            <svg class="ic" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5zM3 12l9 5 9-5M3 16l9 5 9-5" /></svg>
          </button>
          <button class="tb-btn" data-tip="Preview">
            <svg class="ic" viewBox="0 0 24 24">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
          <div class="publish">
            <button class="main">Publish</button>
            <button class="arrow" title="Save options">
              <svg class="ic" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- ================= SIDE PANEL ================= -->
    <aside class="panel">
      <h2>Elements</h2>
      <div class="tabs">
        <button class="on">Widgets</button>
        <button>Globals</button>
      </div>

      <div class="panel-body">
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-4-4" />
          </svg>
          <input type="text" placeholder="Search Widget..." id="q" />
        </label>

        <!-- Layout -->
        <section class="cat open">
          <button class="cat-title" aria-expanded="true">
            <span>Layout<span class="count">2</span></span
            ><svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg>
          </button>
          <div class="cat-body">
            <div class="cat-inner">
              <div class="widgets">
                <div class="widget" data-name="container">
                  <svg viewBox="0 0 32 32">
                    <rect x="4" y="7" width="24" height="18" rx="1.5" stroke-dasharray="2 2" />
                    <rect x="7" y="10" width="18" height="12" rx="1" stroke-dasharray="2 2" />
                  </svg>
                  Container
                </div>
                <div class="widget" data-name="grid">
                  <svg viewBox="0 0 32 32">
                    <rect x="4" y="7" width="24" height="18" rx="1" />
                    <path d="M16 7v18M4 16h24" />
                  </svg>
                  Grid
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- Basic -->
        <section class="cat open">
          <button class="cat-title" aria-expanded="true">
            <span>Basic<span class="count">9</span></span
            ><svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg>
          </button>
          <div class="cat-body">
            <div class="cat-inner">

    <button class="handle" id="toggle" title="Collapse panel">
      <svg viewBox="0 0 10 10"><path d="M7 1 3 5l4 4" /></svg>
    </button>

    <!-- ================= CANVAS ================= -->
    <main class="canvas">
      <div class="drop">
        <div class="drop-btns">
          <button title="Add New Container">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
          </button>
          <button title="Add Template">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg>
          </button>
          <button class="ai" title="Build with AI">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4l1.6 4.4L16 10l-4.4 1.6L10 16l-1.6-4.4L4 10l4.4-1.6zM18 14l.9 2.1L21 17l-2.1.9L18 20l-.9-2.1L15 17l2.1-.9z" /></svg>
          </button>
        </div>
        <p>Drag widget here</p>
      </div>
    </main>

    <script>
      // Toggle sections (each opens/closes independently)
      document.querySelectorAll(".cat").forEach(function (c) {
        var t = c.querySelector(".cat-title");
        t.addEventListener("click", function () {
          var open = c.classList.toggle("open");
          t.setAttribute("aria-expanded", open ? "true" : "false");
        });
      });

      // Widget search filter
      document.getElementById("q").addEventListener("input", function (e) {
        var v = e.target.value.trim().toLowerCase();
        document.querySelectorAll(".widget").forEach(function (w) {
          w.style.display = !v || w.dataset.name.indexOf(v) > -1 ? "" : "none";
        });
        document.querySelectorAll(".cat").forEach(function (c) {
          var any = Array.prototype.some.call(c.querySelectorAll(".widget"), function (w) {
            return w.style.display !== "none";
          });
          c.style.display = any ? "" : "none";
          if (v && any) {
            c.classList.add("open");
          }
        });
      });
      // Panel collapse toggle
      document.getElementById("toggle").addEventListener("click", function () {
        document.body.classList.toggle("collapsed");
      });
      // Tabs
      document.querySelectorAll(".tabs button").forEach(function (b) {
        b.addEventListener("click", function () {
          document.querySelectorAll(".tabs button").forEach(function (x) {
            x.classList.remove("on");
          });
          b.classList.add("on");
        });
      });
      // Device switcher
      document.querySelectorAll(".tb-devices .tb-btn").forEach(function (b) {
        b.addEventListener("click", function () {
          document.querySelectorAll(".tb-devices .tb-btn").forEach(function (x) {
            x.classList.remove("on");
          });
          b.classList.add("on");
        });
      });
    </script>
  </body>
</html>
